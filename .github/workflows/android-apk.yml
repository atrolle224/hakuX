# Builds the hakuX APK (native core + app) on GitHub's runners, following
# android/README.md. Fork-only test builds: a debug-signed APK with the
# application ID com.rfandango.haku_x.debug, so it installs next to the
# official app.
name: Android APK

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"
  # The Dimensity 8300 (Cortex-A715/A510) and every Snapdragon 865 or newer
  # have these; without them the core calls out for every atomic RMW.
  HAKUX_ARCH: "armv8.2-a+fp16+dotprod+rcpc"

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: FEX fork and its submodules
        run: |
          git submodule update --init --depth 50 external/fex || git submodule update --init external/fex
          git -C external/fex submodule update --init --depth 1 External/fmt External/range-v3 \
            External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse

      - name: Third-party sources (NC_DEPS, android/README.md revisions)
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/deps"; mkdir -p "$D/root/subprojects"
          tag() { git clone -q --depth 1 --branch "$2" "$1" "$3"; }
          rev() { mkdir -p "$3"; git -C "$3" init -q; git -C "$3" remote add origin "$1";
                  git -C "$3" fetch -q --depth 1 origin "$2"; git -C "$3" checkout -q FETCH_HEAD; }
          tag https://github.com/zeux/volk.git 1.4.304 "$D/volk"
          tag https://github.com/KhronosGroup/glslang.git 16.1.0 "$D/glslang"
          tag https://github.com/KhronosGroup/SPIRV-Reflect.git vulkan-sdk-1.4.328.0 "$D/spirv_reflect"
          tag https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator.git v3.3.0 "$D/vma"
          tag https://github.com/libsdl-org/SDL.git release-3.4.18 "$D/SDL3"
          rev https://github.com/xemu-project/nv2a_vsh_cpu.git 561fe80da57a881f89000256b459440c0178a7ce "$D/root/subprojects/nv2a_vsh_cpu"
          # libslirp 4.7.0 at 26be815b (android/README.md): a short ID, so the full history
          git clone -q https://gitlab.freedesktop.org/slirp/libslirp.git "$D/libslirp"
          git -C "$D/libslirp" checkout -q 26be815b
          git clone -q https://github.com/bylaws/libadrenotools.git "$D/adrenotools"
          git -C "$D/adrenotools" checkout -q 8fae8ce254dfc1344527e05301e43f37dea2df80
          git -C "$D/adrenotools" submodule update --init --recursive --depth 1
          git -C "$D/adrenotools" apply "$GITHUB_WORKSPACE/tools/native/adrenotools-kgsl-context-priority.patch"
          echo "NC_DEPS=$D" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-36" \
            "build-tools;36.1.0" "cmake;3.31.6" >/dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y -qq ninja-build >/dev/null

      - uses: actions/cache@v4
        with:
          path: build/native/core
          key: native-${{ hashFiles('external/fex/**/CMakeLists.txt', 'native/cmake/*.cmake') }}-${{ github.sha }}
          restore-keys: native-${{ hashFiles('external/fex/**/CMakeLists.txt', 'native/cmake/*.cmake') }}-

      - name: Native core
        run: |
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DCMAKE_BUILD_TYPE=Release \
            -DNC_DEPS="$NC_DEPS" -DHAKUX_ARCH="$HAKUX_ARCH"
          ninja -C build/native/core hakuxcore
          bash tools/native/app-libs.sh

      - name: APK
        working-directory: android
        run: |
          chmod +x gradlew
          # gradle.properties names the developer's own JDK; the runner's is JAVA_HOME
          sed -i '/^org.gradle.java.home/d' gradle.properties
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hakuX-android-arm64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
